name: Import Art WebP pages
on:
  push:
    branches: [main]
    paths: ['art_pages.zip', '.github/workflows/import-art-pages.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          archive=Path('art_pages.zip')
          if not archive.exists(): raise SystemExit('Upload art_pages.zip to repository root')
          with ZipFile(archive) as z:
              files=[f for f in z.infolist() if not f.is_dir()]
              expected={f'{i:02}.webp' for i in range(1,36)}
              if {f.filename for f in files}!=expected or len(files)!=35:
                  raise ValueError('Archive must contain exactly 01.webp through 35.webp')
              dest=Path('assets/art/pages')
              dest.mkdir(parents=True,exist_ok=True)
              for f in files:
                  if f.file_size>8_000_000: raise ValueError('Page too large')
                  data=z.read(f)
                  if not data.startswith(b'RIFF') or data[8:12]!=b'WEBP': raise ValueError('Invalid WebP')
                  (dest/f.filename).write_bytes(data)
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/pages/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import high-resolution art pages"
            git push
          fi
