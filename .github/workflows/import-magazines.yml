name: Import magazine pages
on:
  push:
    branches: [main]
    paths:
      - 'magazine_pages.zip'
      - '.github/workflows/import-magazines.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract magazine images safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("magazine_pages.zip")
          if not archive.exists():
              print("No magazine_pages.zip found; nothing to import.")
              raise SystemExit(0)
          allowed = {"kids", "world"}
          count = 0
          with ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue
                  p = Path(item.filename)
                  if len(p.parts) != 2 or p.parts[0] not in allowed or p.suffix.lower() != ".webp" or not p.stem.isdigit():
                      raise ValueError(f"Unexpected archive path: {item.filename}")
                  if item.file_size > 4_000_000:
                      raise ValueError(f"Image too large: {item.filename}")
                  dest = Path("assets") / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(item))
                  count += 1
          if count == 0:
              raise ValueError("Archive contains no WebP images")
          print(f"Extracted {count} magazine pages")
          PY
      - name: Commit pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kids assets/world
          if ! git diff --cached --quiet; then
            git commit -m "assets: import magazine page images"
            git push
          else
            echo "Magazine pages already up to date"
          fi
