<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><title>DEV — Мой путь — просмотр</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:15px Arial,sans-serif;background:#f8f5ef;color:#332b25}.viewer{height:100dvh;display:flex;flex-direction:column;min-height:0}.top{height:54px;flex:none;display:flex;align-items:center;justify-content:center;padding:8px 16px}h1{font:clamp(17px,3vw,24px) Georgia,serif;margin:0}.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px 12px}.book{position:relative;flex:none;touch-action:pan-y}.page{background:#fff;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}.controls{height:72px;flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;flex-wrap:wrap}.controls button{border:0;border-radius:5px;background:#40372f;color:white;padding:11px 15px;min-width:43px;font-size:16px}.controls button:disabled{opacity:.35}.counter{min-width:62px;text-align:center}.zoom{min-width:48px;text-align:center;font-size:13px}.hint{font-size:11px;color:#85766b;text-align:center;margin:0 0 6px}@media(max-width:600px){.top{height:44px}.controls{height:65px;gap:6px}.controls button{padding:9px 11px}.hint{display:none}}
</style></head><body><main class="viewer"><header class="top"><h1>DEV · «Мой путь»</h1></header><section class="stage" id="stage"><div class="book" id="book"></div></section><nav class="controls" aria-label="Управление журналом"><button id="prev" aria-label="Предыдущая страница">←</button><span class="counter" id="counter">1 / 20</span><button id="next" aria-label="Следующая страница">→</button><button id="minus" aria-label="Уменьшить масштаб">−</button><span class="zoom" id="zoom">100%</span><button id="plus" aria-label="Увеличить масштаб">+</button></nav><p class="hint">Листайте страницы стрелками или свайпом</p></main>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const count=20,folder="world",book=document.getElementById("book"),stage=document.getElementById("stage");let flip=null,scale=1,portrait=false,index=0;
function render(){const w=Math.max(180,stage.clientWidth-32),h=Math.max(180,stage.clientHeight-32);portrait=w<680;const pageH=Math.floor(Math.min(h,portrait?w/.72:w/1.44,680)),pageW=Math.floor(pageH*.72);if(flip){try{index=flip.getCurrentPageIndex();flip.destroy()}catch(e){console.warn(e)}flip=null}book.replaceChildren();book.style.width=(portrait?pageW:pageW*2)+"px";book.style.height=pageH+"px";const pages=[];for(let i=1;i<=count;i++){const el=document.createElement("div");el.className="page";if(i===1||i===count)el.dataset.density="hard";const img=document.createElement("img");img.src="../assets/"+folder+"/"+String(i).padStart(2,"0")+".webp";img.alt="Страница "+i;img.loading="eager";img.decoding="async";el.append(img);pages.push(el)}if(!window.St?.PageFlip){book.textContent="Не удалось загрузить просмотрщик. Обновите страницу.";return}flip=new St.PageFlip(book,{width:pageW,height:pageH,size:"fixed",showCover:true,usePortrait:true,showPageCorners:false,drawShadow:true,flippingTime:700,mobileScrollSupport:false,swipeDistance:25,disableFlipByClick:false});Promise.all(pages.map(el=>{const img=el.querySelector('img');return new Promise(resolve=>{if(img.complete){resolve();return}img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true})})})).then(()=>{if(!book.isConnected)return;flip.loadFromHTML(pages);flip.on("flip",update);flip.on("init",update);try{flip.turnToPage(Math.min(index,count-1))}catch(e){}applyZoom();update()})}
function update(){if(!flip)return;index=flip.getCurrentPageIndex();document.getElementById("counter").textContent=(index+1)+" / "+count;document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index>=count-2}
function applyZoom(){book.style.transform="scale("+scale+")";book.style.transformOrigin="center center";document.getElementById("zoom").textContent=Math.round(scale*100)+"%"}
document.getElementById("prev").onclick=()=>flip?.flipPrev();document.getElementById("next").onclick=()=>flip?.flipNext();document.getElementById("minus").onclick=()=>{scale=Math.max(.6,Math.round((scale-.1)*10)/10);applyZoom()};document.getElementById("plus").onclick=()=>{scale=Math.min(1.5,Math.round((scale+.1)*10)/10);applyZoom()};document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")flip?.flipNext();if(e.key==="ArrowLeft")flip?.flipPrev()});let resizeTimer;window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,180)});render();
</script></body></html>
